name: Build Jukebox Image

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: "Upstream Feishin version without the v prefix (leave empty to use the version pinned in the Dockerfile)"
        required: false
        default: ""
        type: string
  push:
    branches:
      - jukebox-bridge
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig.web.json"
      - "docker/**"
      - ".github/workflows/jukebox-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push jukebox image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: git fetch --tags https://github.com/jeffvli/feishin.git

      - name: Derive patch from commits
        id: patch
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BASE_VERSION: ${{ inputs.base_version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE_VERSION=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BASE_VERSION="$INPUT_BASE_VERSION"
          fi
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=$(grep "^ARG BASE_VERSION=" docker/jukebox.Dockerfile | sed 's/.*=//; s/"//g')
          fi
          BRANCH_BASE=$(grep "^ARG BRANCH_BASE=" docker/jukebox.Dockerfile | sed 's/.*=//; s/"//g')

          if [ -z "$BASE_VERSION" ] || [ -z "$BRANCH_BASE" ]; then
            echo "ERROR: could not read ARG BASE_VERSION / BRANCH_BASE from docker/jukebox.Dockerfile"
            exit 1
          fi
          echo "Base version: $BASE_VERSION"
          echo "Branch base tag: v$BRANCH_BASE"

          if ! git rev-parse "refs/tags/v${BRANCH_BASE}" >/dev/null 2>&1; then
            echo "ERROR: Branch base tag v${BRANCH_BASE} not found in repository"
            exit 1
          fi

          # Without this the patch would contain upstream changes (or their reverse) instead of ours
          if ! git merge-base --is-ancestor "refs/tags/v${BRANCH_BASE}" HEAD; then
            echo "ERROR: refs/tags/v${BRANCH_BASE} is not an ancestor of HEAD."
            echo "The branch must be rebased directly onto the BRANCH_BASE tag."
            echo "HEAD:        $(git rev-parse HEAD)"
            echo "BRANCH_BASE: $(git rev-parse "refs/tags/v${BRANCH_BASE}")"
            echo "merge-base:  $(git merge-base HEAD "refs/tags/v${BRANCH_BASE}")"
            exit 1
          fi

          # Extend this list when the feature touches additional files
          ALLOWED_FILES="package.json tsconfig.web.json src/renderer/api/subsonic/subsonic-controller.ts src/renderer/features/player/audio-player/engine/jukebox-player-engine.tsx src/renderer/features/player/audio-player/jukebox-player.tsx src/renderer/features/player/audio-player/utils/jukebox-queue.ts src/renderer/features/player/audio-player/utils/jukebox-queue.test.ts src/renderer/layouts/default-layout.tsx src/renderer/store/player.store.ts src/shared/api/subsonic/subsonic-types.ts src/shared/types/domain-types.ts"

          CHANGED_FILES=$(git diff --name-only "refs/tags/v${BRANCH_BASE}" HEAD -- .)
          echo "=== Files changed relative to v${BRANCH_BASE} ==="
          echo "$CHANGED_FILES"
          echo "=== End files list ==="

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docker/*|.github/*|README.md)
                continue
                ;;
            esac
            case " $ALLOWED_FILES " in
              *" $file "*)
                ;;
              *)
                echo "ERROR: unexpected changed file outside the allowlist: $file"
                echo "Allowed files:"
                printf '  %s\n' $ALLOWED_FILES
                exit 1
                ;;
            esac
          done <<< "$CHANGED_FILES"

          # shellcheck disable=SC2086
          git diff "refs/tags/v${BRANCH_BASE}" HEAD -- $ALLOWED_FILES > overlay.patch
          if [ ! -s overlay.patch ]; then
            echo "ERROR: generated patch is empty"
            exit 1
          fi
          echo "Patch generated: $(wc -l < overlay.patch) lines"

          # shellcheck disable=SC2086
          commit_count=$(git rev-list --count "refs/tags/v${BRANCH_BASE}..HEAD" -- $ALLOWED_FILES)
          if [ "$commit_count" -gt 40 ]; then
            echo "ERROR: Too many patch-affecting commits ($commit_count > 40) between BRANCH_BASE and HEAD"
            echo "This suggests BRANCH_BASE is misconfigured."
            exit 1
          fi
          echo "Patch spans $commit_count commit(s)"

          if ! git rev-parse "refs/tags/v${BASE_VERSION}" >/dev/null 2>&1; then
            echo "ERROR: upstream tag v${BASE_VERSION} not found after fetching upstream tags"
            exit 1
          fi

          {
            echo "base_version=${BASE_VERSION}"
            echo "run_number=${RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout upstream at base version
        uses: actions/checkout@v6
        with:
          repository: jeffvli/feishin
          ref: refs/tags/v${{ steps.patch.outputs.base_version }}
          path: upstream-src
          persist-credentials: false

      - name: Apply patch and verify
        run: |
          patch -d upstream-src -p1 --batch --forward --fuzz=0 --no-backup-if-mismatch < overlay.patch || {
            echo "ERROR: patch application failed"
            exit 1
          }

          leftovers=$(find upstream-src \( -name '*.rej' -o -name '*.orig' \) -not -path '*/node_modules/*' -not -path '*/.git/*')
          if [ -n "$leftovers" ]; then
            echo "ERROR: patch left behind .rej or .orig files:"
            echo "$leftovers"
            exit 1
          fi

          # A silently dropped hunk would otherwise only show up at runtime
          while IFS='|' read -r file marker; do
            [ -z "$file" ] && continue
            if ! grep -qF -- "$marker" "upstream-src/$file"; then
              echo "ERROR: marker '$marker' not found in $file"
              exit 1
            fi
          done <<'MARKERS'
          package.json|"test:jukebox"
          tsconfig.web.json|allowImportingTsExtensions
          src/renderer/api/subsonic/subsonic-controller.ts|mute: query.mute
          src/renderer/features/player/audio-player/engine/jukebox-player-engine.tsx|shouldSendMute
          src/renderer/features/player/audio-player/jukebox-player.tsx|isSongChangeSeekReset
          src/renderer/features/player/audio-player/utils/jukebox-queue.ts|export function isSongChangeSeekReset
          src/renderer/features/player/audio-player/utils/jukebox-queue.test.ts|isSongChangeSeekReset
          src/renderer/layouts/default-layout.tsx|playback.type === PlayerType.DLNA
          src/renderer/store/player.store.ts|replaceQueueFromServer
          src/shared/api/subsonic/subsonic-types.ts|'setMute'
          src/shared/types/domain-types.ts|'setMute'
          MARKERS

          cp docker/jukebox-ng.conf.template upstream-src/jukebox-ng.conf.template
          echo "Patch applied and verified"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags
        id: tags
        env:
          BASE_VERSION: ${{ steps.patch.outputs.base_version }}
          RUN_NUMBER: ${{ steps.patch.outputs.run_number }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/feishin-jukebox"
          VERSIONED_TAG="${IMAGE}:${BASE_VERSION}-jukebox.${RUN_NUMBER}"
          MOVING_TAG="${IMAGE}:${BASE_VERSION}-jukebox"

          {
            echo "tags=${VERSIONED_TAG},${MOVING_TAG}"
            echo "versioned_tag=${VERSIONED_TAG}"
            echo "moving_tag=${MOVING_TAG}"
          } >> "$GITHUB_OUTPUT"

          echo "Image tags:"
          echo "  Versioned: ${VERSIONED_TAG}"
          echo "  Moving:    ${MOVING_TAG}"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7.2.0
        with:
          context: upstream-src
          file: docker/jukebox.Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          push: true
          build-args: |
            BASE_VERSION=${{ steps.patch.outputs.base_version }}

      - name: Output image reference to job summary
        env:
          VERSIONED_TAG: ${{ steps.tags.outputs.versioned_tag }}
          MOVING_TAG: ${{ steps.tags.outputs.moving_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Jukebox Image Built Successfully"
            echo ""
            echo "**Versioned tag** (includes run number):"
            echo "\`\`\`"
            echo "${VERSIONED_TAG}"
            echo "\`\`\`"
            echo ""
            echo "**Moving tag** (latest build with this base version):"
            echo "\`\`\`"
            echo "${MOVING_TAG}"
            echo "\`\`\`"
            echo ""
            echo "**Digest**:"
            echo "\`\`\`"
            echo "${DIGEST}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
